  <style>
    /* ── Paste your own CSS variables / resets above this block ── */

    .pdf-carousel {
      width: 100%;
      
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Slide viewport */
    .pdf-carousel__stage {
      position: relative;
      width: 100%;
      background: #f5f5f3; /* swap for your surface colour */
      border-radius: 8px;
      overflow: hidden;
      /* 16:9 aspect ratio — adjust if your slides differ */
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pdf-carousel__canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Loading / error state */
    .pdf-carousel__status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #888;
      pointer-events: none;
    }

    /* Arrow buttons — positioned over the stage */
    .pdf-carousel__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      padding: 0;
    }

    .pdf-carousel__btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 1);
    }

    .pdf-carousel__btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .pdf-carousel__btn--prev { left: 12px; }
    .pdf-carousel__btn--next { right: 12px; }

    .pdf-carousel__btn svg {
      width: 18px;
      height: 18px;
      stroke: #333;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Counter */
    .pdf-carousel__counter {
      font-size: 0.85rem;
      color: #888; /* swap for your muted text colour */
      letter-spacing: 0.04em;
    }

    /* Dot indicators */
    .pdf-carousel__dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pdf-carousel__dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ccc;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .pdf-carousel__dot--active {
      background: #333; /* swap for your accent colour */
      transform: scale(1.3);
    }

    /* Keyboard hint */
    .pdf-carousel__hint {
      font-size: 0.75rem;
      color: #bbb;
    }

    /* Responsive: hide arrows on very small screens, use swipe instead */
    @media (max-width: 480px) {
      .pdf-carousel__btn {
        width: 32px;
        height: 32px;
      }
      .pdf-carousel__btn svg {
        width: 14px;
        height: 14px;
      }
    }
  </style>
</head>
<body>



  <div class="pdf-carousel" id="brokerCarousel" aria-label="Broker Series slide viewer">

    <div class="pdf-carousel__stage">
      <canvas class="pdf-carousel__canvas" id="pdfCanvas" aria-label="Slide content"></canvas>
      <div class="pdf-carousel__status" id="pdfStatus">Loading…</div>

      <button class="pdf-carousel__btn pdf-carousel__btn--prev" id="btnPrev" aria-label="Previous slide" disabled>
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <button class="pdf-carousel__btn pdf-carousel__btn--next" id="btnNext" aria-label="Next slide">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="pdf-carousel__counter" id="pdfCounter" aria-live="polite">— / —</div>

    <div class="pdf-carousel__dots" id="pdfDots" role="tablist" aria-label="Slide navigation"></div>

    <p class="pdf-carousel__hint">Use ← → arrow keys to navigate</p>

  </div>

  <!-- PDF.js from cdnjs (no build step needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    // ── CONFIG ────────────────────────────────────────────────────────────
    const PDF_URL = '../../Images/broker-4.pdf'; // ← change to your PDF path
    const RENDER_SCALE = 2;                  // 2 = sharp on retina, lower = faster
    // ─────────────────────────────────────────────────────────────────────

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const canvas   = document.getElementById('pdfCanvas');
    const ctx      = canvas.getContext('2d');
    const status   = document.getElementById('pdfStatus');
    const counter  = document.getElementById('pdfCounter');
    const dotsEl   = document.getElementById('pdfDots');
    const btnPrev  = document.getElementById('btnPrev');
    const btnNext  = document.getElementById('btnNext');

    let pdfDoc     = null;
    let pageNum    = 1;
    let rendering  = false;
    let dots       = [];

    // Touch / swipe state
    let touchStartX = 0;

    async function renderPage(num) {
      if (rendering) return;
      rendering = true;
      status.textContent = '';

      const page     = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: RENDER_SCALE });

      canvas.width  = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport }).promise;

      counter.textContent = `${num} / ${pdfDoc.numPages}`;
      btnPrev.disabled = num <= 1;
      btnNext.disabled = num >= pdfDoc.numPages;

      dots.forEach((d, i) => {
        d.classList.toggle('pdf-carousel__dot--active', i + 1 === num);
        d.setAttribute('aria-selected', i + 1 === num ? 'true' : 'false');
      });

      rendering = false;
    }

    function goTo(num) {
      if (!pdfDoc) return;
      num = Math.max(1, Math.min(num, pdfDoc.numPages));
      if (num === pageNum && !rendering) return;
      pageNum = num;
      renderPage(pageNum);
    }

    function buildDots(total) {
      dotsEl.innerHTML = '';
      dots = [];
      // Only show dots if ≤ 20 pages; beyond that they clutter
      if (total > 20) return;
      for (let i = 1; i <= total; i++) {
        const btn = document.createElement('button');
        btn.className = 'pdf-carousel__dot';
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-label', `Go to slide ${i}`);
        btn.setAttribute('aria-selected', 'false');
        btn.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(btn);
        dots.push(btn);
      }
    }

    // Load PDF
    pdfjsLib.getDocument(PDF_URL).promise.then(pdf => {
      pdfDoc = pdf;
      status.textContent = '';
      buildDots(pdf.numPages);
      renderPage(pageNum);
    }).catch(err => {
      status.textContent = 'Could not load PDF. Check the file path.';
      console.error(err);
    });

    // Arrow buttons
    btnPrev.addEventListener('click', () => goTo(pageNum - 1));
    btnNext.addEventListener('click', () => goTo(pageNum + 1));

    // Keyboard navigation (scoped to carousel focus)
    document.getElementById('brokerCarousel').setAttribute('tabindex', '0');
    document.getElementById('brokerCarousel').addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  { e.preventDefault(); goTo(pageNum - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(pageNum + 1); }
    });

    // Touch / swipe support
    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) goTo(diff > 0 ? pageNum + 1 : pageNum - 1);
    }, { passive: true });
  </script>
